<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%">
  <defs>
    <linearGradient id="upBlueGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- UP Crest / Emblem Graphic -->
  <g transform="translate(10, 5)">
    <!-- Hexagonal / Orbital Badge -->
    <polygon points="28,2 52,16 52,44 28,58 4,44 4,16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Stylized Atomic/Molecular Orbital & UP Monogram -->
    <ellipse cx="28" cy="30" rx="18" ry="7" fill="none" stroke="#ffffff" stroke-width="1.8" transform="rotate(-30, 28, 30)" opacity="0.9"/>
    <ellipse cx="28" cy="30" rx="18" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(30, 28, 30)" opacity="0.9"/>
    <circle cx="28" cy="30" r="4.5" fill="#38bdf8"/>
    
    <text x="28" y="34" font-family="'Montserrat', 'Open Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="10" fill="#0f172a" text-anchor="middle">UP</text>
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="75" y="26" font-family="'Montserrat', 'Open Sans', 'Segoe UI', -apple-system, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="-0.2px">
    KATEDRA FYZIKÁLNÍ CHEMIE
  </text>
  
  <!-- Subtitles -->
  <text x="75" y="43" font-family="'Open Sans', 'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.2px">
    Přírodovědecká fakulta • Univerzita Palackého v Olomouci
  </text>
  
  <text x="75" y="58" font-family="'Open Sans', 'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5px">
    STUDIJNÍ PROGRAM POČÍTAČOVÁ CHEMIE
  </text>

  <!-- Vertical separator / accent -->
  <line x1="66" y1="10" x2="66" y2="60" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
</svg>
